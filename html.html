<!DOCTYPE html>
<html lang="en">
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: rgb(31, 4, 53);
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    border:2px solid #000;
    display:flex;
}

.sidebar{
    width:200px;
    border-right:2px solid #000;
    padding:30px 20px;
    background: pink;
}

.menu{
    border:2px solid #000;
    padding:12px;
    text-align:center;
    margin-bottom:15px;
    border-radius:5px;
    background:pink;
    color:white;
    font-weight:bold;
}

.main-content{
    flex:1;
    padding:20px;
    background: pink;
}

.cards{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:30px;
}

.card{
    width:180px;
    border:2px solid #000;
    padding:15px;
    text-align:center;
    background: pink;
    color:white;
    border-radius:8px;
}

.image-box{
    font-size:70px;
    margin-bottom:15px;
}


.banner{
    border:2px solid #000;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:100px;
    font-weight:bold;
    background: pink        ;
    color:white ;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <div class="menu">Home</div>
        <div class="menu">About</div>
        <div class="menu">Projects</div>
        <div class="menu">Contact Us</div>
    </div>
  
    <div class="main-content">

        <div class="cards">

            <div class="card">
                <div class="image-box">🖥️</div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>

            <div class="card">
                <div class="image-box">💻</div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>

        </div>

        <div class="banner">
         💻
        </div>

    </div>

</div>

</body>
</html>
